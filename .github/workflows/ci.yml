name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ========== 门禁 1: Lint ==========
  lint:
    name: 1. Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: corepack enable && pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

  # ========== 门禁 2: TypeCheck ==========
  typecheck:
    name: 2. TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: corepack enable && pnpm install --frozen-lockfile

      - name: Run TypeScript type check
        run: pnpm typecheck

  # ========== 门禁 3: Test (单元 + 集成 + E2E) ==========
  test:
    name: 3. Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: corepack enable && pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run unit & integration tests with coverage
        run: pnpm test:coverage

      - name: Check coverage threshold (>= 75%)
        run: |
          echo "Coverage thresholds are enforced in each package's vitest.config.ts"
          echo "lib: 80%, ui: 75%, features: 75%"

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test results (screenshots & videos)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  # ========== 门禁 4: Build ==========
  build:
    name: 4. Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: corepack enable && pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: apps/web/.next/
          retention-days: 1

  # ========== 门禁 5: Lighthouse ==========
  lighthouse:
    name: 5. Lighthouse
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: corepack enable && pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm --filter @team-portal-lite/web build

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli

      - name: Run Lighthouse CI
        run: |
          pnpm --filter @team-portal-lite/web start --port 3000 &
          SERVER_PID=$!
          echo "Waiting for server to start..."
          npx wait-on http://localhost:3000 -t 60000
          lhci autorun --config=./lighthouse-budget.json
          EXIT_CODE=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $EXIT_CODE

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 7